openapi: 3.1.0
info:
  title: ihy API
  version: 0.1.0
  description: >-
    First-party API for the ihy music streaming server. Names are
    returned as display names computed from the user's preferences
    (locale chain, artist name history policy); canonical_name carries
    the MusicBrainz canonical name alongside.
servers:
  - url: /
tags:
  - name: auth
  - name: user
  - name: library
paths:
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Credentials' }
      responses:
        '200':
          description: Session cookie set.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      responses:
        '200':
          description: Cookie cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
  /auth/tokens:
    get:
      operationId: listTokens
      tags: [auth]
      security: [{ sessionOrToken: [] }]
      responses:
        '200':
          description: The user's API tokens.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApiToken' }
    post:
      operationId: createToken
      tags: [auth]
      security: [{ sessionOrToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '201':
          description: Raw token, returned exactly once.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenCreated' }
  /auth/tokens/{id}:
    delete:
      operationId: revokeToken
      tags: [auth]
      security: [{ sessionOrToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '404':
          description: Token not found.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/display-prefs:
    get:
      operationId: getDisplayPrefs
      tags: [user]
      security: [{ sessionOrToken: [] }]
      responses:
        '200':
          description: Display-name preferences per entity type.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DisplayPref' }
    put:
      operationId: putDisplayPrefs
      tags: [user]
      security: [{ sessionOrToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/DisplayPref' }
      responses:
        '200':
          description: Stored.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DisplayPref' }
  /search:
    get:
      operationId: search
      tags: [library]
      security: [{ sessionOrToken: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200':
          description: >-
            Recordings matching by title, aliases, or linked work
            names, plus artists, release-groups and releases matching
            by name or alias. Every hit carries its display name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SearchHit' }
  /artists/{mbid}:
    get:
      operationId: getArtist
      tags: [library]
      security: [{ sessionOrToken: [] }]
      parameters:
        - name: mbid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >-
            The artist with display name, aliases, and the albums the
            artist appears on: primary (release-group level credit) or
            featured (track-level only).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artist' }
        '404':
          description: Unknown artist.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /release-groups/{mbid}:
    get:
      operationId: getReleaseGroup
      tags: [library]
      security: [{ sessionOrToken: [] }]
      parameters:
        - name: mbid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >-
            The release-group: primary artists (all release-group
            level credits), the concrete releases, and the recordings
            with credits.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReleaseGroupDetail' }
        '404':
          description: Unknown release-group.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /recordings/{mbid}:
    get:
      operationId: getRecording
      tags: [library]
      security: [{ sessionOrToken: [] }]
      parameters:
        - name: mbid
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: >-
            The recording: display name, credits with roles and
            attributes, the work behind it, and the playable file
            sources ordered by release date.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordingDetail' }
        '404':
          description: Unknown recording.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /stream/files/{id}:
    get:
      operationId: streamFile
      tags: [library]
      security: [{ sessionOrToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: upcoming
          in: query
          required: false
          schema: { type: string }
          description: >-
            Advisory. Comma-separated file ids the client expects to
            stream next (its queue head). The server may prefetch them
            into the OS page cache for gapless playback and NFS
            smoothing, and may ignore, dedupe or truncate the list
            (max 5). Client behavior must never depend on it.
      responses:
        '200':
          description: >-
            The audio bytes. Range, HEAD, If-Modified-Since and
            If-Range are supported; Content-Type reflects the file
            format.
          content:
            application/octet-stream: {}
        '404':
          description: Unknown file id, or the file row exists but the file is gone from disk.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /stream/files/{id}/transcode:
    get:
      operationId: transcodeFile
      tags: [library]
      security: [{ sessionOrToken: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
        - name: profile
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: >-
            Name of a server-provided transcode profile (see
            /transcode-profiles), e.g. opus-128.
        - name: upcoming
          in: query
          required: false
          schema: { type: string }
          description: >-
            Advisory. Comma-separated file ids the client expects to
            stream next with this profile. The server may pre-transcode
            them into its cache (speculatively, evicted if never
            played) and may ignore, dedupe or truncate the list.
      responses:
        '200':
          description: >-
            The transcoded audio bytes. Range, HEAD,
            If-Modified-Since and If-Range are supported; the first
            request of a key transcodes synchronously, later ones are
            served from the cache.
          content:
            application/octet-stream: {}
        '404':
          description: Unknown file id or unknown profile name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /transcode-profiles:
    get:
      operationId: listTranscodeProfiles
      tags: [library]
      security: [{ sessionOrToken: [] }]
      responses:
        '200':
          description: The server's transcode profiles.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TranscodeProfile' }
    post:
      operationId: createTranscodeProfile
      tags: [library]
      security: [{ sessionOrToken: [] }]
      description: Admins only; non-admins get 403.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscodeProfileInput' }
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscodeProfile' }
        '403':
          description: Not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Profile name already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /transcode-profiles/{id}:
    put:
      operationId: updateTranscodeProfile
      tags: [library]
      security: [{ sessionOrToken: [] }]
      description: Admins only; non-admins get 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TranscodeProfileInput' }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TranscodeProfile' }
        '403':
          description: Not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown profile id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      operationId: deleteTranscodeProfile
      tags: [library]
      security: [{ sessionOrToken: [] }]
      description: Admins only; non-admins get 403.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Status' }
        '403':
          description: Not an admin.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Unknown profile id.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
components:
  securitySchemes:
    sessionOrToken:
      type: http
      description: >-
        Session cookie (ihy_session) or Authorization: Bearer <api
        token>.
      scheme: bearer
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    Status:
      type: object
      required: [status]
      properties:
        status: { type: string }
    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    ApiToken:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        created_at: { type: string, format: date-time }
    TokenRequest:
      type: object
      properties:
        name: { type: string }
    ApiTokenCreated:
      type: object
      required: [token, name]
      properties:
        token: { type: string }
        name: { type: string }
    DisplayPref:
      type: object
      required: [entity_type, locale_chain, history_policy]
      properties:
        entity_type:
          type: string
          enum: [artist, release_group, release, recording, work]
        locale_chain:
          type: array
          items: { type: string }
          description: Ordered locale chain; empty = canonical names.
        history_policy:
          type: string
          enum: [current, at_release]
          description: >-
            How renamed artists display: current name or the name used
            when the release came out.
    SearchHit:
      type: object
      required: [type, mbid, name]
      properties:
        type:
          type: string
          enum: [recording, artist, release_group, release]
        mbid: { type: string, format: uuid }
        name: { type: string, description: Display name }
        canonical_name: { type: string }
        sub:
          type: string
          description: >-
            Context line, e.g. the artist names of a recording.
    Alias:
      type: object
      required: [name]
      properties:
        name: { type: string }
        locale: { type: string }
        primary: { type: boolean }
        begin: { type: string }
        end: { type: string }
    Credit:
      type: object
      required: [artist_mbid, artist_name, role, position]
      properties:
        artist_mbid: { type: string, format: uuid }
        artist_name: { type: string, description: Display name of the artist }
        role: { type: string, description: Raw MusicBrainz relationship type }
        details: { type: string, description: Attributes, e.g. "guitar" }
        position: { type: integer }
        joinphrase: { type: string }
    NamedRef:
      type: object
      required: [mbid, name]
      properties:
        mbid: { type: string, format: uuid }
        name: { type: string, description: Display name }
        canonical_name: { type: string }
    TranscodeProfile:
      type: object
      required: [id, name, container, codec, bitrate_kbps]
      properties:
        id: { type: integer, format: int64 }
        name:
          type: string
          description: Stable name clients reference, e.g. opus-128.
        container:
          type: string
          description: Container, verbatim ffmpeg muxer name (e.g. ogg).
        codec:
          type: string
          description: Audio codec, verbatim ffmpeg encoder name (e.g. libopus).
        bitrate_kbps:
          type: integer
          description: Target bitrate in kbit/s; VBR target for codecs with a VBR mode.
    TranscodeProfileInput:
      type: object
      required: [name, container, codec, bitrate_kbps]
      properties:
        name:
          type: string
          description: Stable name clients reference, e.g. opus-128.
        container:
          type: string
          description: Container, verbatim ffmpeg muxer name (e.g. ogg).
        codec:
          type: string
          description: Audio codec, verbatim ffmpeg encoder name (e.g. libopus).
        bitrate_kbps:
          type: integer
    StreamSource:
      type: object
      required: [url, format]
      properties:
        url:
          type: string
          description: >-
            Stream path, e.g. /stream/files/42. Supports Range,
            HEAD and If-Modified-Since; pass ?upcoming= with the next
            file ids for prefetch. For transcoded playback use
            /stream/files/42/transcode?profile=...
        format:
          type: string
          description: >-
            Raw container format from the scan, e.g. flac or mp3.
        size_bytes: { type: integer, format: int64 }
    Artist:
      type: object
      required: [mbid, name, albums]
      properties:
        mbid: { type: string, format: uuid }
        name: { type: string, description: Display name }
        canonical_name: { type: string }
        sort_name: { type: string }
        type: { type: string }
        country: { type: string }
        begin: { type: string }
        end: { type: string }
        aliases:
          type: array
          items: { $ref: '#/components/schemas/Alias' }
        albums:
          type: array
          items: { $ref: '#/components/schemas/AlbumAppearance' }
    AlbumAppearance:
      type: object
      required: [mbid, name, relationship]
      properties:
        mbid: { type: string, format: uuid }
        name: { type: string, description: Display name }
        canonical_name: { type: string }
        first_release_date: { type: string }
        relationship:
          type: string
          enum: [primary, featured]
          description: >-
            primary = the artist holds a release-group level credit;
            featured = the artist appears only on tracks.
        featured_tracks:
          type: integer
          description: Number of tracks the artist appears on (featured only).
    ReleaseGroupDetail:
      type: object
      required: [mbid, name, primary_artists, releases]
      properties:
        mbid: { type: string, format: uuid }
        name: { type: string, description: Display name }
        canonical_name: { type: string }
        primary_type: { type: string }
        secondary_types:
          type: array
          items: { type: string }
        first_release_date: { type: string }
        primary_artists:
          type: array
          items: { $ref: '#/components/schemas/NamedRef' }
          description: All release-group level credits; several for joint works.
        releases:
          type: array
          items: { $ref: '#/components/schemas/NamedRef' }
    RecordingDetail:
      type: object
      required: [mbid, name, credits]
      properties:
        mbid: { type: string, format: uuid }
        name: { type: string, description: Display name }
        canonical_name: { type: string }
        length_ms: { type: integer }
        streams:
          type: array
          description: >-
            Playable file sources for this recording, ordered by
            release date; the first entry is the preferred one. Empty
            when no scanned file is linked yet.
          items: { $ref: '#/components/schemas/StreamSource' }
        aliases:
          type: array
          items: { $ref: '#/components/schemas/Alias' }
        credits:
          type: array
          items: { $ref: '#/components/schemas/Credit' }
        work:
          allOf:
            - $ref: '#/components/schemas/NamedRef'
            - type: object
              properties:
                composers:
                  type: array
                  items: { type: string }
                  description: Display names of the work's composer credits.
