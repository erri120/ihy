# User deployment for ihy.
#
# Configure by creating a .env file next to this file, then run
# `docker compose up -d`:
#
#   DB_HOST=db                    # keep: the database service below
#   DB_USER=ihy
#   DB_PASSWORD=<your password>
#   DB_DATABASE=ihy
#   IHY_LIBRARY=/mnt/nfs/music    # host path of your (read-only) library
#
# Optional variables:
#   DB_PORT (5432), DB_SSLMODE (disable), IHY_PORT (7731)
#
# Notes:
#   * The library is mounted READ-ONLY; the app never writes to it.
#     Multiple roots: add more :ro volume lines and extend IHY_LIBRARIES.
#   * Album art is stored as server-generated thumbnails (never
#     full-size); transcode output is a disposable cache on a tmpfs
#     (size via IHY_TRANSCODE_TMPFS_SIZE).
#   * If the postgres data volume lives on NFS, use a `hard` client
#     mount and export it with `sync` on the server; postgres supports
#     NFS under exactly those conditions.

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${IHY_PORT:-7731}:7731"
    environment:
      DB_HOST: ${DB_HOST:?set in .env}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:?set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set in .env}
      DB_DATABASE: ${DB_DATABASE:?set in .env}
      IHY_LIBRARIES: ${IHY_LIBRARIES:-/music}
      IHY_MB_BASE_URL: ${IHY_MB_BASE_URL:-https://musicbrainz.org}
      IHY_MB_RATE_LIMIT: ${IHY_MB_RATE_LIMIT:-1}
      IHY_ARTWORK_DIR: /data/artwork
      IHY_TRANSCODE_DIR: /data/transcode
      IHY_ADMIN_PASSWORD: ${IHY_ADMIN_PASSWORD:?set in .env (first boot only)}
    volumes:
      - ${IHY_LIBRARY:?set in .env}:/music:ro
      - artwork:/data/artwork
    tmpfs:
      # Transcode output is a disposable cache: keep it off persistent
      # storage and size it explicitly. The app also evicts oldest
      # entries first; IHY_TRANSCODE_MAX_BYTES caps it further if you
      # point IHY_TRANSCODE_DIR at a real filesystem instead.
      - /data/transcode:size=${IHY_TRANSCODE_TMPFS_SIZE:-1g}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:?set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set in .env}
      POSTGRES_DB: ${DB_DATABASE:?set in .env}
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  dbdata:
  artwork:
