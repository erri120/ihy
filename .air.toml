# make dev-ui: rebuild and restart ihy on Go changes. templ files are
# regenerated by `go tool templ generate --watch` (run alongside air
# in the make target); the generated _templ.go edits trigger the
# rebuild here.
root = "."
tmp_dir = "/tmp/ihy-air"

[build]
  cmd = "go build -o /tmp/ihy-dev ./cmd/ihy"
  bin = "/tmp/ihy-dev"
  include_ext = ["go"]
  exclude_dir = ["examples", "data", "docs", "migrations", "ihy-air-tmp"]
  delay = 1000
